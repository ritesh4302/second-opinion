name: ios

on:
  push:
    branches: [main]
    paths:
      - "mobile/ios/**"
      - "mobile/shared/**"
      - "mobile/build.gradle.kts"
      - "mobile/settings.gradle.kts"
      - "mobile/gradle/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "mobile/ios/**"
      - "mobile/shared/**"
      - "mobile/build.gradle.kts"
      - "mobile/settings.gradle.kts"
      - "mobile/gradle/**"
      - ".github/workflows/ios.yml"

env:
  FIREBASE_PROJECT_ID: pharmacy-opinion-3
  # iOS app ID for org.charged-proton.secondopinion
  # (mobile/ios/SecondOpinion/GoogleService-Info.plist)
  FIREBASE_APP_ID_IOS: 1:352579493765:ios:2034da767b6af732226eec

jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@v4

      # latest-stable rather than a hard pin: runner images drop old Xcodes
      # quickly (macos-26 ships only 26.x), and the app targets iOS 17.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The shared KMP framework build (embedAndSignAppleFrameworkForXcode)
      # needs a JDK; Kotlin/Native compilation is the slow step, so Gradle
      # caching matters most here.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with build/dependency caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Ruby + bundler cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: mobile/ios

      - name: Cache SPM checkouts
        uses: actions/cache@v4
        with:
          path: mobile/ios/build/fastlane/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('mobile/ios/SecondOpinion.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Shared-module tests + simulator build
        run: bundle exec fastlane test

  # Signed Ad Hoc build + App Distribution. Gated on the repository variable
  # IOS_SIGNING_READY=true, set once the Apple Developer Program membership
  # and Match secrets exist (docs/TODO.md iOS §5): APPLE_TEAM_ID,
  # MATCH_GIT_URL, MATCH_GIT_TOKEN, MATCH_PASSWORD.
  build-adhoc:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.IOS_SIGNING_READY == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with build/dependency caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Ruby + bundler cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: mobile/ios

      - name: Cache SPM checkouts
        uses: actions/cache@v4
        with:
          path: mobile/ios/build/fastlane/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('mobile/ios/SecondOpinion.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build signed Ad Hoc IPA (uploads dSYMs to Crashlytics)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane build_adhoc

      - name: Upload IPA for the distribute job
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: mobile/ios/build/fastlane/SecondOpinion.ipa
          retention-days: 3
          if-no-files-found: error

  distribute:
    needs: build-adhoc
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for keyless (Workload Identity Federation) authentication.
      id-token: write
    steps:
      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: ipa
          path: ipa

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: pharmacy-opinion-3
          workload_identity_provider: projects/352579493765/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-ftl-ci@pharmacy-opinion-3.iam.gserviceaccount.com

      # Same keyless pattern as the Android distribute job: the Firebase CLI
      # picks up the WIF credentials via GOOGLE_APPLICATION_CREDENTIALS.
      - name: Distribute IPA via Firebase App Distribution
        env:
          RELEASE_NOTES: |
            ${{ github.event.head_commit.message }}

            Commit: ${{ github.sha }}
        run: |
          npx --yes firebase-tools@14 appdistribution:distribute \
            ipa/SecondOpinion.ipa \
            --project "$FIREBASE_PROJECT_ID" \
            --app "$FIREBASE_APP_ID_IOS" \
            --groups internal-testers \
            --release-notes "$RELEASE_NOTES"
