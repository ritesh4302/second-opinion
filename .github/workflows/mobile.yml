name: mobile

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]

env:
  FIREBASE_PROJECT_ID: pharmacy-opinion-3
  # Android app ID for org.pharmacy.secondopinion (mobile/app/google-services.json)
  FIREBASE_APP_ID: 1:352579493765:android:abb89faa3ac520fb226eec
  # CI-owned results bucket; the Google-managed default test-lab-* bucket
  # rejects service-account uploads (storage.objects.create 403).
  FTL_RESULTS_BUCKET: pharmacy-opinion-3-ftl-results

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with build/dependency caching)
        uses: gradle/actions/setup-gradle@v4

      # CI builds point at the production backend (Cloud Run) because the
      # distributed APK runs on tester devices with no adb-reverse bridge.
      - name: Build debug APK and instrumentation test APK
        run: >
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
          -PbackendBaseUrl=https://so-api-7i4kw4366a-el.a.run.app

      - name: Upload APKs for the Test Lab job
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            mobile/app/build/outputs/apk/debug/app-debug.apk
            mobile/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 3
          if-no-files-found: error

  firebase-test-lab:
    needs: build
    # Test Lab device time is quota-limited, so run it only for release tags;
    # branch pushes and PRs get build verification from the job above.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for keyless (Workload Identity Federation) authentication.
      id-token: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: pharmacy-opinion-3
          workload_identity_provider: projects/352579493765/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-ftl-ci@pharmacy-opinion-3.iam.gserviceaccount.com

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Run instrumentation tests on Firebase Test Lab
        run: |
          gcloud firebase test android run \
            --project "$FIREBASE_PROJECT_ID" \
            --results-bucket "$FTL_RESULTS_BUCKET" \
            --type instrumentation \
            --app apks/debug/app-debug.apk \
            --test apks/androidTest/debug/app-debug-androidTest.apk \
            --device model=panther,version=33,locale=en,orientation=portrait \
            --timeout 20m \
            --num-flaky-test-attempts 1

      - name: Run Robo test on Firebase Test Lab
        run: |
          gcloud firebase test android run \
            --project "$FIREBASE_PROJECT_ID" \
            --results-bucket "$FTL_RESULTS_BUCKET" \
            --type robo \
            --app apks/debug/app-debug.apk \
            --device model=panther,version=33,locale=en,orientation=portrait \
            --timeout 10m

  distribute:
    needs: build
    # Ship every mobile/ change that lands on main to the tester group;
    # PRs get build verification only and tags additionally run Test Lab.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for keyless (Workload Identity Federation) authentication.
      id-token: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: pharmacy-opinion-3
          workload_identity_provider: projects/352579493765/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-ftl-ci@pharmacy-opinion-3.iam.gserviceaccount.com

      # The Firebase CLI picks up the WIF credentials exported by the auth
      # step via GOOGLE_APPLICATION_CREDENTIALS; no JSON key is involved.
      - name: Distribute debug APK via Firebase App Distribution
        env:
          RELEASE_NOTES: |
            ${{ github.event.head_commit.message }}

            Commit: ${{ github.sha }}
        run: |
          npx --yes firebase-tools@14 appdistribution:distribute \
            apks/debug/app-debug.apk \
            --project "$FIREBASE_PROJECT_ID" \
            --app "$FIREBASE_APP_ID" \
            --groups internal-testers \
            --release-notes "$RELEASE_NOTES"
